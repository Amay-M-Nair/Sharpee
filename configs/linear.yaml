# Linear control: one linear layer, trained with the networks' Sharpe-after-costs loss.
model: linear
lookback: 30
params: {}
train:
  lr: 0.001
  weight_decay: 0.00001
  max_epochs: 40
  patience: 6
  block_days: 64
  grad_clip: 1.0
  exposure_lambda: 0.0
  train_cost_bps: 5.0
tune:                     # Fold 1 only; every value is logged as a trial
  train.lr: [0.001, 0.0003]
