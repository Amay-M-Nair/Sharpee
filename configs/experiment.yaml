# Portfolio, costs and evaluation periods shared by every strategy.
cost_bps: 5.0                 # per unit of traded notional
cost_grid: [0, 5, 10, 20]     # sensitivity
cap: 0.02                     # single-name cap on |x|
embargo_days: 30              # dropped at the end of train and validation periods

train_start: 2010
val_years: 2
test_years: [2020, 2021, 2022, 2023]
holdout_years: [2024, 2025]   # run once, after every setting is frozen

runs_dir: runs
reports_dir: reports
seed: 0

# Realistic costs, evaluation only (docs/realistic_costs.md)
realistic_costs:
  tiers: [[100, 3.0], [200, 5.0], [300, 7.0]]   # liquidity rank up to N -> bps per unit traded
  tier_floor_bps: 10.0                          # below the last tier, or no dollar volume
  scenarios:
    realistic: {spread_mult: 1.0, borrow_rate: 0.005}
    stress: {spread_mult: 2.0, borrow_rate: 0.02}
  primary: realistic
